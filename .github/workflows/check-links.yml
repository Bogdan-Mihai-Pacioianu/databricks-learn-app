name: Verifică linkurile resurselor

# Doar citește: verifică linkurile și publică rezultatul ca artefact și în jurnal.
on:
  push:
    branches:
      - "claude/etapa-d-private-repo-fo4avo"
    paths:
      - "app/resources-urls.txt"
      - "tools/check_links.js"
      - ".github/workflows/check-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verifică fiecare link
        run: node tools/check_links.js
      - uses: actions/upload-artifact@v4
        with:
          name: resources-status156
          path: app/assets/resources-status156.json
